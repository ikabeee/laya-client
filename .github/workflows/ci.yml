name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**", "claude/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Also creates and activates the virtual environment at .venv.
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Test
        run: .venv/bin/python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build mock image
        run: docker build -t laya-client:mock --build-arg ENGINE=mock .
      - name: Smoke test
        run: |
          docker run -d --name laya -p 8000:8000 laya-client:mock
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs localhost:8000/v1/systemone -H 'content-type: application/json' -d '{
            "state": "We were billed twice, refund please",
            "questions": {"dept": {"type": "choice", "instructions": "Which team?",
                                   "criteria": {"billing": "refunds", "tech": "bugs"}}}}'
          curl -fs localhost:8000/docs > /dev/null
          docker rm -f laya
