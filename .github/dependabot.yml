version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
