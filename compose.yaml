# docker compose up -d --build                  -> CPU, API on http://127.0.0.1:8000 (docs at /docs)
# docker compose -f compose.yaml -f compose.gpu.yaml up -d --build   -> NVIDIA GPU (see compose.gpu.yaml)
# docker compose --profile proxy up -d          -> plus Caddy with automatic HTTPS (set LAYA_DOMAIN)
#
# The container runs the real Laya model. If torch, the GPU or the checkpoints fail at start-up it exits
# with the reason (`docker compose logs laya-client`) instead of serving errors.
services:
  laya-client:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: laya-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Bound to localhost: put a reverse proxy (the `proxy` profile below, nginx ...) in front.
      # Use "8000:8000" to expose it directly, and then do set LAYA_API_KEY.
      - "${LAYA_BIND:-127.0.0.1}:${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_PORT: "8000"
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
    volumes:
      # Model weights are downloaded once and survive container rebuilds.
      - laya-models:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      # The first start downloads 1-2 GB of weights before the server listens.
      start_period: 15m
      retries: 3

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      laya-client:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAYA_DOMAIN: ${LAYA_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  laya-models:
  caddy-data:
  caddy-config:
