[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "laya-client"
version = "0.1.0"
description = "Self-hosted REST service for Laya System-1 decisions, wire-compatible with the Jev /v1/systemone API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["laya", "system-one", "decision-engine", "fastapi", "jev", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "scalar-fastapi>=1.0.0",
]

[project.optional-dependencies]
# The inference engine. Required to run the service; install torch for your hardware first (`make setup`
# does both). Kept as an extra only so `make check` can lint and unit-test without torch.
engine = ["laya>=0.3.28"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
laya-client = "laya_client.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    # Starlette nudges towards httpx2 for its TestClient; httpx still works and is what FastAPI documents.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is the framework's idiom
    "UP031",  # %-formatting is used on purpose for error messages
]
