# Example nginx site for a VPS where laya-client runs on 127.0.0.1:8000 (systemd or compose).
# TLS: run `certbot --nginx -d api.example.com` after enabling this site.
server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Inference on CPU can take seconds for large batches.
        proxy_read_timeout 120s;
    }
}
